<title>Trắc nghiệm chương 1</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#eef3f9;
    color:#222;
    -webkit-text-size-adjust:100%;
}

/* HEADER */
.header{
    background:#0a4a8a;
    color:white;
    padding:14px 16px;
    text-align:center;
    font-size:20px;
    font-weight:bold;

    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;

    min-height:56px;
}

#timer{
    position:absolute;
    right:15px;
    font-size:16px;
    font-weight:bold;
    background:#083b70;
    padding:6px 9px;
    border-radius:6px;
}

/* CONTAINER */
.container{
    width:calc(100% - 24px);
    max-width:900px;
    margin:15px auto;
    background:white;
    padding:18px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.08);
}

/* QUESTION */
.question{
    margin-top:20px;
    margin-bottom:10px;
    font-weight:bold;
    font-size:16px;
    line-height:1.5;
}

/* ANSWERS */
.answers{
    width:100%;
}

.answers label{
    display:block;
    margin:7px 0;
    padding:10px 9px;
    border-radius:7px;
    cursor:pointer;
    line-height:1.5;
    font-size:16px;

    border:1px solid #e0e6ed;
    background:#fff;

    /* Giúp bấm dễ trên màn hình cảm ứng */
    min-height:44px;

    transition:background 0.15s;
}

.answers label:hover{
    background:#f0f6ff;
}

.answers input{
    width:18px;
    height:18px;
    margin-right:8px;
    vertical-align:middle;
}

/* ĐÚNG / SAI */
.correct{
    background:#c8f7c5 !important;
    border-color:#5cb85c !important;
}

.wrong{
    background:#f7c5c5 !important;
    border-color:#d9534f !important;
}

/* BUTTON */
button{
    padding:12px 20px;
    margin:8px 4px;
    background:#0a74da;
    color:white;
    border:none;
    border-radius:7px;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    min-height:44px;
}

button:active{
    transform:scale(0.97);
}

/* RESULT */
#result{
    margin-top:18px;
    text-align:center;
    font-size:18px;
    line-height:1.6;
    font-weight:bold;
}

/* =========================
   IPHONE / MOBILE
========================= */
@media screen and (max-width:600px){

    .header{
        padding:12px 10px;
        font-size:18px;
        min-height:54px;
    }

    #timer{
        right:8px;
        font-size:14px;
        padding:5px 7px;
    }

    .container{
        width:calc(100% - 16px);
        margin:8px auto;
        padding:12px;
        border-radius:8px;
    }

    .question{
        margin-top:18px;
        margin-bottom:8px;
        font-size:16px;
        line-height:1.5;
    }

    .answers label{
        font-size:16px;
        padding:11px 8px;
        margin:6px 0;
        line-height:1.45;
    }

    .answers input{
        width:18px;
        height:18px;
    }

    #submitArea{
        text-align:center;
    }

    button{
        width:calc(50% - 12px);
        margin:8px 4px;
        padding:12px 5px;
        font-size:15px;
    }
}

/* Màn hình rất nhỏ */
@media screen and (max-width:380px){

    .header{
        font-size:16px;
    }

    #timer{
        font-size:13px;
    }

    .container{
        width:calc(100% - 10px);
        padding:9px;
    }

    .question{
        font-size:15px;
    }

    .answers label{
        font-size:15px;
    }

    button{
        font-size:14px;
    }
}
</style>

// ===== TRỘN CÂU HỎI =====
function shuffle(arr){
    return arr.sort(() => Math.random() - 0.5);
}

shuffle(data);

let cauhoi = 10;

// ===== HIỂN THỊ CÂU HỎI =====
const quiz = document.getElementById("quiz");

data.forEach((item, i) => {
if (cauhoi > i){
    let answers = item.a.map((text, index) => ({
        text,
        correct:index === item.c
    }));

    answers = shuffle(answers);

    let html = `
        <div class="question">
            Câu ${i + 1}: ${item.q}
        </div>

        <div class="answers">
    `;

    answers.forEach(ans => {

        if(ans.text != 0){
            html += `
                <label>
                    <input
                        type="radio"
                        name="q${i}"
                        value="${ans.correct}"
                    >
                    ${ans.text}
                </label>
            `;
        }

    });

    html += `</div>`;

    quiz.innerHTML += html;}
});

// ===== NÚT NỘP =====
document.getElementById("submitArea").innerHTML = `
    <div style="margin-top:20px;text-align:center;">
        <button type="button" onclick="grade()">Nộp bài</button>
        <button type="button" onclick="location.reload()">Làm lại</button>
    </div>
`;

// ===== ĐẾM GIỜ =====
let time = 900;

let timer = setInterval(() => {

    let m = Math.floor(time / 60);
    let s = time % 60;

    document.getElementById("timer").innerText =
        `${m}:${s < 10 ? "0" + s : s}`;

    time--;

    if(time < 0){
        clearInterval(timer);
        grade();
    }

},1000);

// ===== CHẤM ĐIỂM =====
function grade(){

    clearInterval(timer);

    let score = 0;

    data.forEach((_, i) => {

        let selected =
            document.querySelector(`input[name="q${i}"]:checked`);

        let list =
            document.querySelectorAll(`input[name="q${i}"]`);

        list.forEach(el => {

            el.disabled = true;

            el.parentElement.classList.remove(
                "correct",
                "wrong"
            );

        });

        if(selected){

            if(selected.value === "true"){

                score++;

                selected.parentElement.classList.add("correct");

            }else{

                selected.parentElement.classList.add("wrong");

                let correct =
                    document.querySelector(
                        `input[name="q${i}"][value="true"]`
                    );

                if(correct){
                    correct.parentElement.classList.add("correct");
                }
            }
        }
    });

    let msg = "";

    if(score / cauhoi >= 45 / 50)
        msg = "🏆 Xuất sắc";

    else if(score / cauhoi >= 35 / 50)
        msg = "🎉 Giỏi";

    else if(score / cauhoi >= 25 / 50)
        msg = "👍 Khá";

    else if(score / cauhoi >= 15 / 50)
        msg = "🙂 Trung bình";

    else
        msg = "❌ Cần ôn lại";

    document.getElementById("result").innerHTML =
        `Kết quả: ${score}/${cauhoi}<br><b>${msg}</b>`;
}
</script>
